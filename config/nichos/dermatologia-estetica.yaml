# Configuração do nicho: dermatologia estética
# Para criar outro nicho, copie este arquivo e ajuste os campos.

nome: Dermatologia Estética
idioma: pt-BR

# Perfil de quem vai publicar — usado para calibrar tom e autoridade dos roteiros
perfil:
  descricao: Médica dermatologista com foco em estética
  tom_de_voz: Acessível e acolhedor, mas com autoridade técnica. Desmistifica sem infantilizar.
  publico: Mulheres de 25 a 55 anos interessadas em cuidados com a pele e procedimentos estéticos

# Palavras-chave usadas na descoberta de vídeos virais (misture PT e EN:
# o algoritmo dos Shorts é global e tendências costumam nascer em inglês)
palavras_chave:
  - skincare dermatologista
  - dermatologista responde
  - botox preenchimento
  - harmonização facial
  - acne tratamento
  - melasma
  - protetor solar mitos
  - skincare routine dermatologist
  - retinol como usar
  - bioestimulador de colágeno

# ── Formas de busca (coleta local, gratuita e ilimitada) ─────────────────
# 1) Hashtags — o que a comunidade marca. Misture PT, EN e ES de propósito:
# viral estrangeiro sem versão forte em PT-BR é janela de oportunidade.
hashtags_monitoradas:
  - dermatologista
  - skincare
  - harmonizacaofacial
  - pelesaudavel
  - dermatologist      # inglês: onde a maioria das trends nasce
  - skincareroutine
  - dermtok
  - skintok
  - dermatologia       # espanhol
  - cuidadodelapiel

# 2) Palavras-chave — pega vídeos que viralizaram SEM usar hashtag do nicho
# (a maioria dos virais grandes não marca hashtag).
#
# Como escolher um bom termo:
#   • Frase, não palavra solta. "pele" sozinho traz de tudo — inclusive o
#     Pelé, porque a busca ignora acento — e "harmonização" sozinho traz
#     harmonização de cores e de música. A intenção mora na frase inteira.
#   • Prefira o que carrega conflito, dúvida, dinheiro, medo ou
#     arrependimento. É disso que viral é feito. "acne" é um assunto;
#     "acne adulta o que fazer" é uma pessoa procurando ajuda.
#   • Escreva como a pessoa fala, não como o consultório escreve.
#     Ninguém digita "hipercromia pós-inflamatória".
#   • Misture idiomas: em inglês nasce a trend, e sem versão forte em
#     PT-BR ela vira janela de oportunidade.
#
# Não precisa acertar de primeira: ao fim de cada coleta o programa mostra
# quanto cada termo rendeu e quais não trouxeram nada — troque os fracos.
buscas_por_palavra:
  # Dúvida real, do jeito que se digita
  - protetor solar mito
  - dermatologista responde
  - melasma tratamento
  - acne adulta
  - retinol como usar
  # Conflito e arrependimento — o combustível mais confiável
  - harmonização facial arrependimento
  - preenchimento deu errado
  # Dinheiro
  - quanto custa preenchimento labial
  - skincare caro vale a pena
  # Inglês: onde a trend costuma nascer
  - skin barrier repair
  - dermatologist reacts
  - dermatologist explains
  # Espanhol
  - dermatóloga explica

# 3) Perfis de referência — os melhores vídeos de quem é forte no nicho.
# Preencha com perfis que ela acompanha (sem o @). Vazio = ignora.
perfis_referencia: []

# Pilares de conteúdo — a agenda distribui as ideias entre eles
pilares:
  - Mitos vs verdades (desmentir viral perigoso ou modinha sem evidência)
  - Educação sobre procedimentos (o que é, para quem é, o que esperar)
  - Rotina e prevenção (skincare baseado em evidência)
  - Bastidores e humanização (dia a dia do consultório, sem expor pacientes)

# Preferências pessoais da profissional (opcional) — use só se ela quiser
# evitar algum assunto ou abordagem específica. Vazio = liberdade total de
# escrita; ela tem autonomia e revisa cada roteiro antes de gravar.
preferencias: []

# Parâmetros da descoberta
descoberta:
  dias_janela: 30          # buscar vídeos publicados nos últimos N dias
  max_por_palavra_chave: 10
  top_n: 15                # quantos virais entram na análise final
  # Filtro de viralidade mínima: sinal abaixo disso não entra na análise
  # (impede que post fraco vire "viral de origem" de uma ideia)
  min_views_tiktok: 50000
  min_likes_instagram: 2000

# Parâmetros da geração
geracao:
  ideias_por_semana: 10    # quantas ideias/roteiros por agenda (as 7 primeiras
                           # ganham dia/horário; o restante vira banco de ideias)
  duracao_alvo_segundos: 45
